<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>剧本工作台</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">剧本工作台</span>

    <div class="chapter-bar">
      <select id="chapterSelect" aria-label="切换章节"></select>
      <button type="button" id="chapterListBtn">章节目录</button>
      <button type="button" id="newChapter">新建章节</button>
      <button type="button" id="chapterSettings">章节设置</button>
    </div>

    <div class="top-actions">
      <button type="button" id="undoBtn" title="撤销 (Ctrl/Cmd+Z)">↶ 撤销</button>
      <button type="button" id="redoBtn" title="重做 (Ctrl/Cmd+Shift+Z)">↷ 重做</button>
      <button type="button" id="cloudBtn">云端草稿</button>
      <button type="button" id="importBtn">导入</button>
      <button type="button" id="exportMd">导出 Markdown</button>
      <button type="button" id="exportJson">导出 JSON</button>
    </div>
  </header>

  <main class="layout">
    <section class="editor-pane">
      <div class="editor" id="editor"></div>
    </section>

    <aside class="preview-pane" id="previewPane">
      <div class="preview-head">
        <span>读者预览</span>
        <label class="auto-locate">
          <input type="checkbox" id="autoLocate" checked>
          跟随光标
        </label>
        <button type="button" id="closePreview">收起</button>
      </div>
      <div class="phone" id="preview"></div>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="saveState">已载入</span>
    <span id="cloudState" class="cloud-state">草稿仅本机</span>
    <span class="keys">Enter 新建 · Shift+Enter 换行 · Tab 切类型 · Alt+↑/↓ 移动 · Ctrl+Z 撤销 · Backspace 删空行</span>
  </footer>

  <button type="button" class="preview-toggle" id="previewToggle">预览</button>
  <div id="modalRoot" hidden></div>

  <script src="./app.js"></script>
</body>
</html>
